<main class="home-page">
  <section class="hero">
    <div class="hero-content">
      <span class="badge">Sistema de Reservas para Restaurantes</span>

      <h1>MesaLivre</h1>

      <p>
        Gerencie mesas, clientes, horários e reservas de forma simples,
        moderna e sem conflitos.
      </p>

      <div class="hero-actions">
        <button class="primary-button" routerLink="/login">
          Entrar no sistema
        </button>

        <button class="secondary-button" type="button" (click)="entrarDemonstracao()">
          Ver demonstração
        </button>
      </div>
    </div>

    <div class="hero-card">
      <div class="card-header">
        <span>Reserva confirmada</span>
        <strong>#1024</strong>
      </div>

      <div class="reservation-info">
        <p><strong>Cliente:</strong> João Silva</p>
        <p><strong>Mesa:</strong> 12</p>
        <p><strong>Data:</strong> 12/06/2026</p>
        <p><strong>Horário:</strong> 19:30 - 21:00</p>
        <p><strong>Pessoas:</strong> 4</p>
      </div>

      <div class="status">CONFIRMADA</div>
    </div>
  </section>
</main>
